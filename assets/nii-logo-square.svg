  <rect x="271" y="140" width="42" height="20" rx="10" fill="#F8FAFC"/>
  <rect x="249" y="352" width="42" height="20" rx="10" fill="#F8FAFC"/>

  <!-- I I -->
  <rect x="320" y="140" width="42" height="232" rx="10" fill="#F8FAFC"/>
